[package]
name = "desktop"
version = "0.1.0"
description = "Salli desktop: local AI expense brain"
authors = ["Sasmitha Ashinsana"]
edition = "2024"

[lib]
# _lib suffix avoids name clash with bin on Windows
name = "desktop_lib"
# rlib only: cdylib/staticlib are for Tauri mobile and break MinGW linking
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true